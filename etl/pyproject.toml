[project]
name = "cnpj-etl"
version = "0.1.0"
description = "ETL dos Dados Abertos CNPJ da Receita Federal para PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "cnpj-core",
    "polars>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "typer>=0.12",
]

[project.scripts]
cnpj-etl = "cnpj_etl.cli:app"

[tool.uv.sources]
cnpj-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpj_etl"]
