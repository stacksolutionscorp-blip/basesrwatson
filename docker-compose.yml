name: cnpj-intel

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnpj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnpj}
      POSTGRES_DB: ${POSTGRES_DB:-cnpj}
    # Ajuste conforme a RAM do servidor (valores para ~16 GB).
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-10GB}
      -c work_mem=${PG_WORK_MEM:-64MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      -c max_wal_size=16GB
      -c checkpoint_timeout=30min
      -c max_parallel_workers_per_gather=4
      -c max_parallel_maintenance_workers=4
      -c random_page_cost=1.1
      -c pg_trgm.similarity_threshold=0.3
    shm_size: 1g
    # só na máquina local (ferramentas de banco, ETL fora do Docker); nunca exponha à internet
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # via TCP: o servidor temporário da inicialização só escuta no socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # Redis sem senha: só local

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cnpj}:${POSTGRES_PASSWORD:-cnpj}@postgres:5432/${POSTGRES_DB:-cnpj}
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cnpj}:${POSTGRES_PASSWORD:-cnpj}@postgres:5432/${POSTGRES_DB:-cnpj}
      REDIS_URL: redis://redis:6379/0
      API_ROOT_PATH: /api      # publicada pelo Caddy em https://SEU_DOMINIO/api
      API_TRUST_PROXY: "1"
    # acesso direto (sem proxy) só pela própria máquina; integrações externas usam /api via Caddy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Front (React) + proxy da API com HTTPS automático (Caddy).
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TILE_HOSTS: ${TILE_HOSTS:-https://*.tile.openstreetmap.org}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Backup diário de app/geo/ops (a base da Receita é recarregável e fica de fora).
  backup:
    image: postgis/postgis:16-3.4
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-cnpj}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cnpj}
      PGDATABASE: ${POSTGRES_DB:-cnpj}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      BACKUP_HORA: ${BACKUP_HORA:-03}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Entrega webhooks de alterações e roda a manutenção (retenção de logs, alertas).
  webhooks:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["cnpj-api", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cnpj}:${POSTGRES_PASSWORD:-cnpj}@postgres:5432/${POSTGRES_DB:-cnpj}
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Geocodificador próprio (extrato Brasil do OSM). Opcional:
  #   docker compose --profile geo up -d nominatim
  # A importação inicial leva algumas horas e ocupa ~100 GB.
  nominatim:
    profiles: ["geo"]
    image: mediagis/nominatim:4.5
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/south-america/brazil-updates/
      IMPORT_STYLE: address
      THREADS: ${NOMINATIM_THREADS:-4}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    shm_size: 1g
    ports:
      - "127.0.0.1:${NOMINATIM_PORT:-8080}:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    restart: unless-stopped

volumes:
  pgdata:
  nominatim-data:
  caddy-data:
  caddy-config:
