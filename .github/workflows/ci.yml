name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://cnpj:cnpj@localhost:5432/postgres
  TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  python:
    name: Python (lint + testes ETL/API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cnpj
          POSTGRES_PASSWORD: cnpj
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cnpj" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --all-groups --locked
      - run: uvx ruff check libs etl api
      - run: uvx ruff format --check libs etl api
      - run: uv run pytest -p no:cacheprovider

  web:
    name: Frontend (tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (navegador)
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cnpj
          POSTGRES_PASSWORD: cnpj
          POSTGRES_DB: cnpj
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cnpj" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://cnpj:cnpj@localhost:5432/cnpj
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-packages --locked
      - name: Base demo + usuário de teste
        run: |
          uv run cnpj-etl demo
          uv run cnpj-api criar-usuario --email admin@demo.com --nome "Admin Demo" --admin --senha demo-senha-123
      - name: Sobe API e front
        run: |
          nohup uv run cnpj-api serve --port 8000 > api.log 2>&1 &
          cd web && npm ci && npm run build
          nohup npx vite preview --port 4173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173/api/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falhas
          path: |
            web/test-results
            api.log
            web.log

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build etl api web
