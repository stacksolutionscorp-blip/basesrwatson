[project]
name = "cnpj-api"
version = "0.1.0"
description = "API REST de consulta e investigação de empresas por CNPJ"
requires-python = ">=3.12"
dependencies = [
    "cnpj-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5,<7",
    "openpyxl>=3.1",
    "httpx>=0.27,<1",
    "typer>=0.12",
]

[project.scripts]
cnpj-api = "cnpj_api.cli:app"

[tool.uv.sources]
cnpj-core = { workspace = true }
cnpj-etl = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "cnpj-etl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpj_api"]
